<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPIO State Viewer</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    margin-top:40px;
}

input{
    padding:8px;
    margin:5px;
}

button{
    padding:8px 16px;
}

img{
    margin-top:20px;
    width:300px;
}

pre{
    background:#f4f4f4;
    padding:10px;
    width:60%;
    margin:auto;
    text-align:left;
}
</style>

</head>

<body>

<h2>GPIO State Monitor</h2>

<label>Device ID:</label> <input type="text" id="device_id" value="device1">

<label>GPIO ID:</label> <input type="number" id="gpio_id" value="1">

<button onclick="fetchState()">Fetch</button>

<br>

<img id="gpioImage" src="https://via.placeholder.com/300/00ff00?text=STATE+1">

<p id="status">Waiting...</p>

<h3>Server Response</h3>
<pre id="serverResponse"></pre>

<h3>Control GPIO</h3>
<button id="btnOn">Turn ON</button>
<button id="btnOff">Turn OFF</button>
<p id="publishResult"></p>

<script>

const url1 = "http://br76.teste.website/~steph999/images/Screenshot%202026-03-11%20194245.png";
const url2 = "http://br76.teste.website/~steph999/images/Screenshot%202026-03-11%20194302.png";

async function fetchState(){

    const device = document.getElementById("device_id").value;
    const gpio = document.getElementById("gpio_id").value;

    const endpoint = `http://br76.teste.website/~steph999/api/populate.php?device_id=${device}&gpio_id=${gpio}`;

    try{

        const response = await fetch(endpoint);
        const data = await response.json();

        // mostrar resposta completa
        document.getElementById("serverResponse").textContent =
            JSON.stringify(data, null, 2);

        if(data.state !== undefined){

            document.getElementById("status").innerText =
                "Timestamp: " + data.timestamp + " | State: " + data.state;

            if(parseInt(data.state) === 1){
                document.getElementById("gpioImage").src = url1;
            }
            else{
                document.getElementById("gpioImage").src = url2;
            }

        } 
        else if(data.message){
            document.getElementById("status").innerText = data.message;
        }
        else if(data.error){
            document.getElementById("status").innerText = "Error: " + data.error;
        }
        else{
            document.getElementById("status").innerText = "Unknown server response";
        }

    }catch(err){

        document.getElementById("status").innerText =
            "Error fetching data";

        console.error(err);
    }
}

setInterval(fetchState, 5000);

// --- MQTT over WebSockets (WSS) ---
// Edit these values to match your broker's WSS settings (HiveMQ Cloud usually provides them)
const WSS_HOST = '92ca7f6444f944cbae30908602073cd5.s1.eu.hivemq.cloud';
const WSS_PORT = 8884; // common WSS port for HiveMQ Cloud; confirm in your dashboard
const WSS_PATH = '/mqtt';
const MQTT_USER = 'Steph';
const MQTT_PASS = 'Steph123';

// Add buttons listeners
document.getElementById('btnOn').addEventListener('click', () => publishCommand('1'));
document.getElementById('btnOff').addEventListener('click', () => publishCommand('0'));

// load mqtt.js from CDN then init
const script = document.createElement('script');
script.src = 'https://unpkg.com/mqtt/dist/mqtt.min.js';
script.onload = initMqtt;
document.head.appendChild(script);

let mqttClient = null;
function initMqtt(){
    const wsUrl = `wss://${WSS_HOST}:${WSS_PORT}${WSS_PATH}`;
    const clientId = 'web_' + Math.random().toString(16).substr(2,8);
    const opts = {
        clientId,
        username: MQTT_USER,
        password: MQTT_PASS,
        keepalive: 30,
        clean: true,
        reconnectPeriod: 2000,
    };

    mqttClient = mqtt.connect(wsUrl, opts);

    mqttClient.on('connect', () => {
        console.log('MQTT (WSS) connected');
        document.getElementById('publishResult').innerText = 'MQTT WSS connected';
    });

    mqttClient.on('reconnect', () => {
        console.log('MQTT reconnecting...');
        document.getElementById('publishResult').innerText = 'MQTT reconnecting...';
    });

    mqttClient.on('error', (err) => {
        console.error('MQTT error', err);
        document.getElementById('publishResult').innerText = 'MQTT error: ' + (err && err.message ? err.message : err);
    });

    mqttClient.on('close', () => {
        console.log('MQTT closed');
        document.getElementById('publishResult').innerText = 'MQTT closed';
    });
}

function publishCommand(cmd){
    const device = document.getElementById('device_id').value;
    const gpio = document.getElementById('gpio_id').value;
    const topic = `tcc_project/${device}/gpio/${gpio}/set`;

    if (mqttClient && mqttClient.connected){
        mqttClient.publish(topic, String(cmd), {qos:0, retain:false}, (err) => {
            if(err) document.getElementById('publishResult').innerText = 'Publish error: ' + err;
            else document.getElementById('publishResult').innerText = 'Published (WSS) to ' + topic;
        });
        return;
    }

    // fallback to server-side publish
    (async () => {
        try{
            const resp = await fetch('/~steph999/api/publish_mqtt.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: new URLSearchParams({device_id: device, gpio_id: gpio, command: cmd})
            });
            const data = await resp.json();
            if(resp.ok) document.getElementById('publishResult').innerText = 'Published (server) to ' + data.topic;
            else document.getElementById('publishResult').innerText = 'Server publish error: ' + (data.error || JSON.stringify(data));
        }catch(e){
            document.getElementById('publishResult').innerText = 'Network fallback error';
            console.error(e);
        }
    })();
}

</script>

</body>
</html>
