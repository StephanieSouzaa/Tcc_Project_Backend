<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPIO Dashboard</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body{
    font-family: Arial;
    text-align:center;
    margin-top:40px;
}

.card{
    border:1px solid #ccc;
    padding:15px;
    margin:10px;
    display:inline-block;
    width:200px;
}

button{
    padding:8px;
    margin:5px;
    width:80px;
}

.on {
    background-color: green;
    color:white;
    padding:5px;
    border-radius:5px;
}

.off {
    background-color: red;
    color:white;
    padding:5px;
    border-radius:5px;
}

</style>

</head>

<body>

<h2>GPIO Dashboard</h2>

<label>Device ID:</label>
<input type="text" id="device_id" value="device1">

<h2>📟 INPUT STATUS</h2>
<div id="inputs"></div>

<h2>🔘 OUTPUT CONTROL</h2>
<div id="outputs"></div>

<p id="status">Waiting...</p>

<script>

// ================= MQTT =================
const client = mqtt.connect(
    "wss://92ca7f6444f944cbae30908602073cd5.s1.eu.hivemq.cloud:8884/mqtt",
    {
        username: "Steph",
        password: "Steph123",
        reconnectPeriod: 2000
    }
);

client.on("connect", () => {
    console.log("MQTT conectado");
});

client.on("error", (err) => {
    console.error(err);
});

// ================= CONFIG =================
const inputPins = [34,35,39];
const outputPins = [2,4,16,17];

// ================= RENDER =================
function renderUI(){

    const inputsDiv = document.getElementById("inputs");
    const outputsDiv = document.getElementById("outputs");

    inputsDiv.innerHTML = "";
    outputsDiv.innerHTML = "";

    // INPUTS
    inputPins.forEach(pin=>{
        inputsDiv.innerHTML += `
        <div class="card">
            <h3>GPIO ${pin}</h3>
            <p id="in_state_${pin}" class="off">...</p>
        </div>`;
    });

    // OUTPUTS
    outputPins.forEach(pin=>{
        outputsDiv.innerHTML += `
        <div class="card">
            <h3>GPIO ${pin}</h3>
            <p id="out_state_${pin}" class="off">...</p>
            <button onclick="send(${pin},1)">ON</button>
            <button onclick="send(${pin},0)">OFF</button>
        </div>`;
    });
}

// ================= SEND MQTT =================
function send(pin, cmd){

    const device = document.getElementById('device_id').value;
    const topic = `tcc_project/${device}/gpio/${pin}/set`;

    client.publish(topic, String(cmd));

    console.log("Enviado:", topic, cmd);
}

// ================= FETCH INPUT + OUTPUT =================
async function fetchState(){

    const device = document.getElementById("device_id").value;

    try{

        // INPUTS
        for(let pin of inputPins){

            const url = `http://br76.teste.website/~steph999/api/populate.php?device_id=${device}&gpio_id=${pin}`;

            const res = await fetch(url);
            const data = await res.json();

            if(data.state !== undefined){

                const el = document.getElementById(`in_state_${pin}`);

                el.innerText = data.state == 1 ? "ON" : "OFF";
                el.className = data.state == 1 ? "on" : "off";
            }
        }

        // OUTPUTS (🔥 NOVO)
        for(let pin of outputPins){

            const url = `http://br76.teste.website/~steph999/api/populate.php?device_id=${device}&gpio_id=${pin}`;

            const res = await fetch(url);
            const data = await res.json();

            if(data.state !== undefined){

                const el = document.getElementById(`out_state_${pin}`);

                el.innerText = data.state == 1 ? "ON" : "OFF";
                el.className = data.state == 1 ? "on" : "off";
            }
        }

    }catch(err){
        console.error(err);
        document.getElementById("status").innerText = "Erro HTTP";
    }
}

// ================= INIT =================
renderUI();
setInterval(fetchState, 3000);

</script>

</body>
</html>
