<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPIO Dashboard</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    margin-top:40px;
}

.card{
    border:1px solid #ccc;
    padding:15px;
    margin:10px;
    display:inline-block;
    width:200px;
}

.on { background-color: #4CAF50; color:white; }
.off { background-color: #f44336; color:white; }

button{
    padding:10px;
    margin:5px;
    width:80px;
}
</style>
</head>

<body>

<h2>📟 INPUT STATUS</h2>

<div id="inputs"></div>

<h2>🔘 OUTPUT CONTROL</h2>

<div id="outputs"></div>

<p id="log"></p>

<script>

const device = "device1";

// ================= INPUTS =================
const inputPins = [34,35,39];

// ================= OUTPUTS =================
const outputPins = [2,4,16,17];

// ================= RENDER =================
function renderUI(){

    const inputsDiv = document.getElementById("inputs");
    const outputsDiv = document.getElementById("outputs");

    // Inputs
    inputPins.forEach(pin=>{
        inputsDiv.innerHTML += `
        <div class="card" id="in_${pin}">
            <h3>GPIO ${pin}</h3>
            <p id="state_${pin}">...</p>
        </div>`;
    });

    // Outputs
    outputPins.forEach(pin=>{
        outputsDiv.innerHTML += `
        <div class="card">
            <h3>GPIO ${pin}</h3>
            <button onclick="send(${pin},1)">ON</button>
            <button onclick="send(${pin},0)">OFF</button>
        </div>`;
    });
}

// ================= FETCH STATUS =================
async function fetchState(){

    for(let pin of inputPins){

        const url = `http://br76.teste.website/~steph999/api/populate.php?device_id=${device}&gpio_id=${pin}`;

        try{
            const res = await fetch(url);
            const data = await res.json();

            if(data.state !== undefined){

                const el = document.getElementById(`state_${pin}`);
                el.innerText = data.state;

                el.className = data.state == 1 ? "on" : "off";
            }

        }catch(e){
            console.log(e);
        }
    }
}

// ================= SEND MQTT =================
async function send(pin, cmd){

    const url = `http://br76.teste.website/~steph999/api/publish_mqtt.php`;

    try{
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: new URLSearchParams({
                device_id: device,
                gpio_id: pin,
                command: cmd
            })
        });

        const data = await res.json();

        document.getElementById("log").innerText =
            "Sent to " + data.topic;

    }catch(e){
        document.getElementById("log").innerText = "Erro";
    }
}

// ================= INIT =================
renderUI();
setInterval(fetchState, 3000);

</script>

</body>
</html>
