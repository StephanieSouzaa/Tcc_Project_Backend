<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPIO Dashboard</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
body{
    font-family: Arial;
    text-align:center;
    margin-top:40px;
}

.card{
    border:1px solid #ccc;
    padding:15px;
    margin:10px;
    display:inline-block;
    width:200px;
}

button{
    padding:8px;
    margin:5px;
    width:80px;
}

.on {
    background-color: green;
    color:white;
    padding:5px;
    border-radius:5px;
}

.off {
    background-color: red;
    color:white;
    padding:5px;
    border-radius:5px;
}

select{
    width:180px;
    height:120px;
}
</style>

</head>

<body>

<h2>GPIO Dashboard</h2>

<label>Device ID:</label>
<input type="text" id="device_id" value="device1">

<hr>

<h3>⚙️ Configuração</h3>

<div style="display:flex; justify-content:center; gap:40px;">
    <div>
        <h4>Saídas</h4>
        <select id="outputs" multiple></select>
    </div>

    <div>
        <h4>Entradas</h4>
        <select id="inputs" multiple></select>
    </div>
</div>

<button onclick="applyConfig()">Aplicar Configuração</button>

<hr>

<h2>📟 INPUT STATUS</h2>
<div id="inputs_view"></div>

<h2>🔘 OUTPUT CONTROL</h2>
<div id="outputs_view"></div>

<p id="status">Waiting...</p>

<script>

// ================= MQTT =================
const client = mqtt.connect(
    "wss://92ca7f6444f944cbae30908602073cd5.s1.eu.hivemq.cloud:8884/mqtt",
    {
        username: "Steph",
        password: "Steph123",
        reconnectPeriod: 2000
    }
);

client.on("connect", () => {
    console.log("MQTT conectado");
});

client.on("error", (err) => {
    console.error(err);
});

// ================= GPIO LIST =================
const ALL_GPIOS = [2,4,13,14,15,16,17,25,26,27,32,33,34,35,39];
const INPUT_ONLY = [34,35,39];

// ================= STATE =================
let inputPins = [];
let outputPins = [];

// ================= POPULATE SELECT =================
const outSel = document.getElementById("outputs");
const inSel = document.getElementById("inputs");

ALL_GPIOS.forEach(gpio => {

    if(!INPUT_ONLY.includes(gpio)){
        outSel.add(new Option("GPIO "+gpio, gpio));
    }

    inSel.add(new Option("GPIO "+gpio, gpio));
});

// ================= BLOQUEIO =================
function syncSelections(){

    const outs = [...outSel.selectedOptions].map(o=>o.value);
    const ins = [...inSel.selectedOptions].map(o=>o.value);

    [...outSel.options].forEach(o=>o.disabled=false);
    [...inSel.options].forEach(o=>o.disabled=false);

    ins.forEach(v=>{
        let opt = [...outSel.options].find(o=>o.value==v);
        if(opt) opt.disabled=true;
    });

    outs.forEach(v=>{
        let opt = [...inSel.options].find(o=>o.value==v);
        if(opt) opt.disabled=true;
    });

    INPUT_ONLY.forEach(g=>{
        let opt = [...outSel.options].find(o=>o.value==g);
        if(opt) opt.disabled=true;
    });
}

outSel.addEventListener("change", syncSelections);
inSel.addEventListener("change", syncSelections);

// ================= APPLY CONFIG =================
function applyConfig(){

    inputPins = [...inSel.selectedOptions].map(o=>Number(o.value));
    outputPins = [...outSel.selectedOptions].map(o=>Number(o.value));

    const device = document.getElementById("device_id").value;

    const payload = {
        inputs: inputPins,
        outputs: outputPins
    };

    console.log("CONFIG:", payload);

    // 🔥 ENVIO MQTT
    client.publish(
        `tcc_project/${device}/config`,
        JSON.stringify(payload)
    );

    renderUI();
}

// ================= RENDER =================
function renderUI(){

    const inputsDiv = document.getElementById("inputs_view");
    const outputsDiv = document.getElementById("outputs_view");

    inputsDiv.innerHTML = "";
    outputsDiv.innerHTML = "";

    inputPins.forEach(pin=>{
        inputsDiv.innerHTML += `
        <div class="card">
            <h3>GPIO ${pin}</h3>
            <p id="in_state_${pin}" class="off">...</p>
        </div>`;
    });

    outputPins.forEach(pin=>{
        outputsDiv.innerHTML += `
        <div class="card">
            <h3>GPIO ${pin}</h3>
            <p id="out_state_${pin}" class="off">...</p>
            <button onclick="send(${pin},1)">ON</button>
            <button onclick="send(${pin},0)">OFF</button>
        </div>`;
    });
}

// ================= SEND =================
function send(pin, cmd){

    const device = document.getElementById('device_id').value;
    const topic = `tcc_project/${device}/gpio/${pin}/set`;

    client.publish(topic, String(cmd));

    console.log("Enviado:", topic, cmd);
}

// ================= FETCH =================
async function fetchState(){

    const device = document.getElementById("device_id").value;

    try{

        for(let pin of inputPins){

            const url = `http://br76.teste.website/~steph999/api/populate.php?device_id=${device}&gpio_id=${pin}`;

            const res = await fetch(url);
            const data = await res.json();

            if(data.state !== undefined){

                const el = document.getElementById(`in_state_${pin}`);

                el.innerText = data.state == 1 ? "ON" : "OFF";
                el.className = data.state == 1 ? "on" : "off";
            }
        }

        for(let pin of outputPins){

            const url = `http://br76.teste.website/~steph999/api/populate.php?device_id=${device}&gpio_id=${pin}`;

            const res = await fetch(url);
            const data = await res.json();

            if(data.state !== undefined){

                const el = document.getElementById(`out_state_${pin}`);

                el.innerText = data.state == 1 ? "ON" : "OFF";
                el.className = data.state == 1 ? "on" : "off";
            }
        }

    }catch(err){
        console.error(err);
        document.getElementById("status").innerText = "Erro HTTP";
    }
}

// ================= LOOP =================
setInterval(fetchState, 3000);

</script>

</body>
</html>
